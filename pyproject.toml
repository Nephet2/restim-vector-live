[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vector1a"
version = "1.6.0a77"
description = "Live MultiFunPlayer L0 to dual-ReStim motion bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
vector1a = "vector1a.app:main"

[tool.setuptools.packages.find]
include = ["vector1a*"]

[tool.setuptools.package-data]
vector1a = ["event_definitions.yml"]
