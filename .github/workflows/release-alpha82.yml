name: Publish alpha82 portable Windows release
on:
  push:
    branches: [release/1.6.0-alpha82]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q vector1a packaging
  release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller>=6,<7"
      - name: Build both Windows editions
        shell: pwsh
        run: |
          ./build-release.ps1
          ./build-exe.ps1
      - name: Extract and smoke-test executable
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "vector-exe-check"
          Expand-Archive -LiteralPath dist/Vector1A-1.6.0-alpha82-windows-exe.zip -DestinationPath $folder
          $exe = Join-Path $folder "Vector1A-1.6.0-alpha82/Vector1A-1.6.0-alpha82.exe"
          $report = Join-Path $env:RUNNER_TEMP "vector-smoke.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", $report) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Executable check timed out" }
          if ($process.ExitCode -ne 0) { throw "Executable check failed: $($process.ExitCode)" }
          $check = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $check.ok -or -not $check.frozen -or $check.version -ne "1.6.0-alpha82") { throw "Invalid executable report" }
          Get-Content -LiteralPath $report
      - name: Check release contents and checksum archives
        shell: pwsh
        run: |
          python packaging/check_archives.py
          Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.0-alpha82 dist/Vector1A-1.6.0-alpha82-windows.zip dist/Vector1A-1.6.0-alpha82-windows.zip.sha256 dist/Vector1A-1.6.0-alpha82-windows-exe.zip dist/Vector1A-1.6.0-alpha82-windows-exe.zip.sha256 --target "$env:GITHUB_SHA" --prerelease --title "Vector 1A 1.6.0-alpha82 - stable connection status and layout" --notes-file RELEASE_NOTES_1.6.0-alpha82.md
