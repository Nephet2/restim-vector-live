name: Publish alpha80 reliability release
on:
  push:
    branches: [release/1.6.0-alpha80]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run regression suite
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q vector1a
      - name: Build Windows source package
        shell: pwsh
        run: |
          ./build-release.ps1
          $zip = Get-Item dist/Vector1A-1.6.0-alpha80-windows.zip
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content "$($zip.FullName).sha256" -Encoding ascii
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.0-alpha80 dist/Vector1A-1.6.0-alpha80-windows.zip dist/Vector1A-1.6.0-alpha80-windows.zip.sha256 --target "$env:GITHUB_SHA" --prerelease --title "Vector 1A 1.6.0-alpha80 — connection reliability" --notes-file RELEASE_NOTES_1.6.0-alpha80.md
