          waveform: sin
          frequency: $buzz_freq
          amplitude: $buzz_intensity
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_up_ms
          max_level_offset: $volume_boost
          mode: additive
      - operation: apply_linear_change
        axis: pulse_width
        params:
          start_value: -50
          end_value: 50
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_up_ms
          mode: additive
      - operation: apply_linear_change
        axis: sensor_suppression
