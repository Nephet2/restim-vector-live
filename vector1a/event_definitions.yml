  # === CORRUPT (4P — INHARMONIC DRIFT) ===
  # Four electrodes each driven by sawtooth waves at inharmonic rates — none share common factors,
  # so they never phase-lock with each other or with the stroke. The sharp sawtooth resets add
  # a glitchy discontinuous quality. Starting phases are deliberately irregular to prevent any
  # coherent pattern at the onset. Base stroke beat remains perceptible underneath (additive).
  # NOTE: Only affects 4P (e1-e4) mode.

  corrupt_4p:
    default_params:
      duration_ms: 30000
      amplitude: 0.3               # Drift depth — reduce if overwhelming, raise for more chaos
      ramp_ms: 2000

    steps:
      - operation: apply_modulation
        axis: e1
        params:
          waveform: sawtooth
          frequency: 0.71
          amplitude: $amplitude
          max_level_offset: 0
          phase: 0
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_ms
          ramp_out_ms: $ramp_ms
          mode: additive

      - operation: apply_modulation
        axis: e2
        params:
          waveform: sawtooth
          frequency: 1.13
          amplitude: $amplitude
          max_level_offset: 0
          phase: 127
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_ms
          ramp_out_ms: $ramp_ms
          mode: additive

      - operation: apply_modulation
        axis: e3
        params:
          waveform: sawtooth
          frequency: 0.89
          amplitude: $amplitude
          max_level_offset: 0
          phase: 251
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_ms
          ramp_out_ms: $ramp_ms
          mode: additive

      - operation: apply_modulation
        axis: e4
        params:
          waveform: sawtooth
          frequency: 1.47
          amplitude: $amplitude
          max_level_offset: 0
          phase: 73
          duration_ms: $duration_ms
          ramp_in_ms: $ramp_ms
          ramp_out_ms: $ramp_ms
          mode: additive

